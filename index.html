<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>หจก. เชียงใหม่ 63 การช่าง - Quantum Voxel OS Mirror Pointer</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root {
            --bg-color: #000000;
            --glass-bg: rgba(13, 17, 23, 0.88);
            --border-glow: rgba(0, 255, 102, 0.4);
            --accent-green: #00ff66;
            --accent-blue: #0a84ff;
            --accent-gold: #d29922;
            --text-main: #f0f6fc;
            --text-sub: #8b949e;
            --font-ios: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
        }
        body, html { width: 100%; height: 100%; margin: 0; padding: 0; background: var(--bg-color); font-family: var(--font-ios); overflow: hidden; }
        #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        .quantum-os-panel {
            position: absolute;
            top: 16px; left: 16px; right: 16px; max-width: 480px;
            background: var(--glass-bg); backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--border-glow); border-radius: 24px; padding: 20px;
            z-index: 1000; box-shadow: 0 20px 60px rgba(0, 255, 102, 0.25); color: var(--text-main); box-sizing: border-box;
            max-height: 92vh; overflow-y: auto;
        }
        h2 { margin: 0 0 2px 0; font-size: 18px; color: #fff; text-align: center; font-weight: 700; text-shadow: 0 0 10px rgba(0,255,102,0.5); }
        .os-subtitle { font-size: 11px; color: var(--accent-green); text-align: center; margin-bottom: 16px; font-weight: 600; letter-spacing: 0.5px; }
        
        .os-tabs { display: flex; gap: 4px; margin-bottom: 14px; background: rgba(0,0,0,0.4); padding: 4px; border-radius: 12px; }
        .os-tab { flex: 1; background: transparent; border: none; color: var(--text-sub); padding: 8px 4px; font-size: 11px; font-weight: bold; border-radius: 8px; cursor: pointer; text-align: center; transition: all 0.2s; }
        .os-tab.active { background: var(--accent-green); color: #000; box-shadow: 0 0 15px rgba(0,255,102,0.4); }

        .os-view { display: none; }
        .os-view.active { display: block; }

        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 12px; color: var(--text-sub); margin-bottom: 4px; font-weight: 500; }
        input, select { width: 100%; padding: 11px 14px; background: rgba(1, 4, 9, 0.9); border: 1px solid rgba(48, 54, 61, 0.8); color: #fff; border-radius: 12px; font-size: 14px; box-sizing: border-box; outline: none; transition: border 0.2s; }
        input:focus, select:focus { border-color: var(--accent-green); box-shadow: 0 0 10px rgba(0,255,102,0.3); }

        .ios-btn { width: 100%; background: var(--accent-green); color: #000; border: none; padding: 13px; font-size: 14px; font-weight: 700; border-radius: 12px; cursor: pointer; margin-top: 8px; box-shadow: 0 4px 20px rgba(0,255,102,0.3); display: flex; justify-content: center; align-items: center; gap: 8px; }
        .ios-btn:active { transform: scale(0.97); opacity: 0.85; }
        .ios-btn.blue { background: var(--accent-blue); color: #fff; }
        .ios-btn.gold { background: var(--accent-gold); color: #000; }

        .quantum-screen { background: rgba(1, 4, 9, 0.95); border: 1px dashed var(--accent-green); padding: 16px; border-radius: 14px; font-size: 12px; line-height: 1.6; margin-top: 10px; }
        .mantra-footer { text-align: center; margin-top: 14px; font-size: 11px; color: var(--accent-gold); font-weight: bold; background: rgba(210, 153, 34, 0.1); padding: 8px; border-radius: 10px; border: 1px dashed var(--accent-gold); }
    </style>
</head>
<body>

    <!-- แผนที่ดาวเทียม Quantum Mirror Pointer -->
    <div id="map"></div>

    <!-- Quantum Voxel OS Control Center -->
    <div class="quantum-os-panel">
        <h2>หจก. เชียงใหม่ 63 การช่าง</h2>
        <div class="os-subtitle">QUANTUM VOXEL OS • MIRROR POINTER DNA INJECTION</div>

        <!-- OS Navigation Tabs -->
        <div class="os-tabs">
            <button id="tab-1" class="os-tab active" onclick="switchOsView(1)">1. พิกัด & DNA</button>
            <button id="tab-2" class="os-tab" onclick="switchOsView(2)">2. ภาษี & 3X</button>
            <button id="tab-3" class="os-tab" onclick="switchOsView(3)">3. คิวดิน/โคกหนอง</button>
            <button id="tab-4" class="os-tab" onclick="switchOsView(4)">4. ใบเสนอราคา</button>
        </div>

        <!-- VIEW 1: GPS & Mirror Pointer -->
        <div id="view-1" class="os-view active">
            <div class="form-group">
                <label>วางลิงก์ Google Maps / พิกัดหน้างาน (Auto-Event Parse):</label>
                <input type="text" id="quantum-maps-link" value="https://maps.app.goo.gl/k6rszxtbnSjoWtrE6">
            </div>
            <button class="ios-btn" onclick="quantumInjectPointer()">⚡ Quantum Inject & Fly Pointer</button>
        </div>

        <!-- VIEW 2: Property Tax & 3X Appraisal -->
        <div id="view-2" class="os-view">
            <div class="form-group">
                <label>ขนาดพื้นที่ดิน (ไร่):</label>
                <input type="number" id="q-rai" value="3" oninput="runQuantumEngine()">
            </div>
            <div class="form-group">
                <label>ราคาประเมินทุนทรัพย์ (บาท / ตร.วา):</label>
                <input type="number" id="q-appraisal" value="5000" oninput="runQuantumEngine()">
            </div>
            <button class="ios-btn blue" onclick="switchOsView(3)">ถัดไป: คำนวณคิวดิน & โคกหนองนา ➔</button>
        </div>

        <!-- VIEW 3: Earthwork & Permaculture -->
        <div id="view-3" class="os-view">
            <div class="form-group">
                <label>ความลึกดินขุด / ถมเฉลี่ย (เมตร):</label>
                <input type="number" id="q-depth" value="1.5" step="0.1" oninput="runQuantumEngine()">
            </div>
            <div class="form-group">
                <label>รูปแบบนิเวศบำนาญ:</label>
                <select id="q-model" onchange="runQuantumEngine()">
                    <option value="koknongna">โคก หนอง นา โมเดล (30:30:30:10)</option>
                    <option value="forest">ป่า 3 อย่าง ประโยชน์ 4 อย่าง</option>
                </select>
            </div>
            <button class="ios-btn gold" onclick="switchOsView(4); runQuantumEngine();">✨ ประมวลผลใบเสนอราคาขั้นสุดยอด</button>
        </div>

        <!-- VIEW 4: BOQ & Mantra Output -->
        <div id="view-4" class="os-view">
            <div id="quantum-output" class="quantum-screen">
                <em>[กำลังประมวลผลตาข่ายพระอินทร์และ Quantum DNA Injection...]</em>
            </div>
            <button class="ios-btn blue" onclick="window.print()" style="margin-top:10px;">🖨️ ปริ้นท์ใบเสนอราคา (PDF / Print)</button>
        </div>

        <!-- Mantra Footer -->
        <div class="mantra-footer">
            "คาถาเงินล้าน: มหาลาโภ ภวันตุ เม... ไหลลื่นไร้รอยต่อ 120 FPS"
        </div>
    </div>

    <script>
        // Event-Driven OS Tab Switching
        function switchOsView(viewId) {
            document.querySelectorAll('.os-view').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.os-tab').forEach(el => el.classList.remove('active'));
            document.getElementById(`view-${viewId}`).classList.add('active');
            document.getElementById(`tab-${viewId}`).classList.add('active');
            if (viewId === 4) runQuantumEngine();
            if (navigator.vibrate) navigator.vibrate(30);
        }

        // Leaflet Mirror Pointer Map Engine (Stable & Fast 120 FPS)
        const map = L.map('map', { zoomControl: false }).setView([18.788300, 98.985300], 16);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Esri Satellite Engine', maxZoom: 19
        }).addTo(map);

        let marker = L.marker([18.788300, 98.985300]).addTo(map)
            .bindPopup("<b>หจก. เชียงใหม่ 63 การช่าง</b><br>Quantum Mirror Pointer Active")
            .openPopup();

        // Quantum DNA Event Injection & Pointer Handler
        function quantumInjectPointer() {
            let url = document.getElementById('quantum-maps-link').value.trim();
            let lat = 18.788300;
            let lon = 98.985300;

            const matchAt = url.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
            if (matchAt) {
                lat = parseFloat(matchAt[1]);
                lon = parseFloat(matchAt[2]);
            }

            map.flyTo([lat, lon], 17, { animate: true, duration: 1.5 });
            marker.setLatLng([lat, lon]).update()
                .bindPopup(`<b>Quantum Pointer Injected</b><br>Lat: ${lat.toFixed(4)}, Lon: ${lon.toFixed(4)}`).openPopup();

            if (navigator.vibrate) navigator.vibrate(60);
            switchOsView(2); // ข้ามไปหน้าภาษีต่อทันทีแบบไร้รอยต่อ
        }

        // Quantum Voxel Engine & Tax Calculation
        function runQuantumEngine() {
            const rai = parseFloat(document.getElementById('q-rai').value) || 3;
            const rate = parseFloat(document.getElementById('q-appraisal').value) || 5000;
            const depth = parseFloat(document.getElementById('q-depth').value) || 1.5;

            const totalSqWah = rai * 400;
            const totalSqm = rai * 1600;
            const appraisalVal = totalSqWah * rate;
            const budget3X = appraisalVal * 3;

            const cutCubic = Math.round(totalSqm * 0.3 * depth);
            const fillCubic = Math.round(totalSqm * 0.2 * depth);
            const earthCost = (cutCubic * 85) + (fillCubic * 150);

            document.getElementById('quantum-output').innerHTML = `
                <div style="font-weight:bold; color:var(--accent-green); font-size:13px; margin-bottom:6px;">🌐 QUANTUM VOXEL OS REPORT</div>
                <strong>พื้นที่สำรวจ:</strong> ${rai} ไร่ (${totalSqWah.toLocaleString()} ตร.วา)<br>
                <strong>งบประมาณ 3X Appraisal:</strong> <span style="color:var(--accent-gold);">${budget3X.toLocaleString()} บาท</span><br>
                <hr style="border-color: rgba(48,54,61,0.8); margin: 8px 0;">
                <strong>📐 ดินขุด (${cutCubic.toLocaleString()} ลบ.ม.) & ดินถม (${fillCubic.toLocaleString()} ลบ.ม.):</strong><br>
                • รวมงานวิศวกรรมดิน: <span style="color:#ff7b72; font-weight:bold;">${earthCost.toLocaleString()} บาท</span><br>
                • นิเวศบำนาญ & โคกหนองนา: ปลดล็อกภาษีรกร้างสู่เกษตรกรรม สำเร็จสมบูรณ์<br>
                <div style="text-align:center; margin-top:8px; color:var(--accent-green); font-weight:bold;">
                    "มหาลาโภ ภวันตุ เม สัมปะติฉามิ"
                </div>
            `;
        }

        window.onload = runQuantumEngine;
    </script>
</body>
</html>
